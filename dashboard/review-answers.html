<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review answers | PowerPrep</title>
    <script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="review-answers.css">
</head>
<body>
    <header class="review-topbar on-dark">
        <a href="index.html" class="btn btn-ghost"><i class="fas fa-arrow-left"></i><span>Dashboard</span></a>
        <a href="index.html" class="brand">
            <span class="brand-mark"><i class="fas fa-dna"></i></span>
            <span class="brand-name">Power<span>Prep</span></span>
        </a>
        <button class="icon-btn theme-toggle" type="button"></button>
    </header>

    <main class="review-main">
        <div id="review-root">
            <div class="empty-state">
                <span class="spinner" style="display:inline-block"></span>
                <p>Loading your answers…</p>
            </div>
        </div>
    </main>

    <script type="module" src="review-answers.js"></script>
</body>
</html>
