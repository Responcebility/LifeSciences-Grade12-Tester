<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioMind Academy | Smart Life Sciences Testing</title>
    <link rel="stylesheet" href="auth/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <div class="logo-header">
                <i class="fas fa-dna logo-icon"></i>
                <h1>BioMind Academy</h1>
                <p class="tagline">Find Your Weakness. Fuel Your Mastery.</p>
                <p class="description">AI-powered life sciences testing with personalized weakness detection.</p>
            </div>
            
            <div class="cta-buttons">
                <a href="auth/login.html" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Login</span>
                </a>
                <a href="auth/signup.html" class="btn btn-secondary">
                    <i class="fas fa-user-plus"></i>
                    <span>Sign Up Free</span>
                </a>
            </div>
            
            <div class="features">
                <div class="feature">
                    <i class="fas fa-brain"></i>
                    <h3>AI Analytics</h3>
                    <p>Discover your weak topics</p>
                </div>
                <div class="feature">
                    <i class="fas fa-medal"></i>
                    <h3>Skill Badges</h3>
                    <p>Earn achievements</p>
                </div>
                <div class="feature">
                    <i class="fas fa-chart-line"></i>
                    <h3>Progress Tracking</h3>
                    <p>Monitor improvement</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
