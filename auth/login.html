<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BioMind Academy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="firebase-config.js"></script>
</head>
<body>
    <div class="container">
        <div class="glass-panel auth-panel">
            <a href="../index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
            
            <div class="logo-header">
                <i class="fas fa-dna logo-icon"></i>
                <h1>Welcome Back</h1>
                <p class="tagline">Continue your mastery journey</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" class="input-field" placeholder="Email" required>
                    <div id="email-error" class="error-message"></div>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="input-field" placeholder="Password" required>
                    <div id="password-error" class="error-message"></div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="remember-me">
                        <span>Remember me</span>
                    </label>
                    <a href="#" id="forgot-password" class="form-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span>Login</span>
                    <i class="fas fa-spinner loading"></i>
                </button>
            </form>
            
            <div class="divider">
                <span>OR</span>
            </div>
            
            <button class="btn btn-google" id="google-login">
                <i class="fab fa-google"></i>
                <span>Sign in with Google</span>
            </button>
            
            <p class="form-footer">
                Don't have an account?
                <a href="signup.html" class="form-link">Sign up</a>
            </p>
        </div>
    </div>
    
    <script type="module" src="login.js"></script>
</body>
</html>
