<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | PowerPrep</title>
    <script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-top">
            <a href="../index.html" class="brand">
                <span class="brand-mark"><i class="fas fa-dna"></i></span>
                PowerPrep
            </a>
            <button class="icon-btn" id="theme-toggle" type="button"></button>
        </div>

        <main class="auth-card card">
            <h1>Create your account</h1>
            <p class="auth-subtitle">Free practice for Grade 12 Life Sciences.</p>

            <div id="form-alert"></div>

            <form id="signup-form" novalidate>
                <div class="field">
                    <label for="signup-name">Name</label>
                    <input type="text" id="signup-name" class="input" placeholder="What should we call you?" autocomplete="given-name" maxlength="40" required>
                    <div id="signup-name-error" class="field-error"></div>
                </div>

                <div class="field">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" class="input" placeholder="you@example.com" autocomplete="email" required>
                    <div id="signup-email-error" class="field-error"></div>
                </div>

                <div class="field">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" class="input" placeholder="At least 6 characters" autocomplete="new-password" required>
                    <div id="signup-password-error" class="field-error"></div>
                </div>

                <div class="field">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" class="input" placeholder="Type it again" autocomplete="new-password" required>
                    <div id="confirm-password-error" class="field-error"></div>
                </div>

                <div class="terms">
                    <label class="checkbox">
                        <input type="checkbox" id="accept-terms">
                        <span>I agree that PowerPrep may store my name, email and test results to track my progress.</span>
                    </label>
                    <div id="terms-error" class="field-error"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block" id="signup-btn">
                    <span class="spinner"></span>
                    <span>Create account</span>
                </button>
            </form>

            <div class="divider">or</div>

            <button type="button" class="btn btn-google btn-lg btn-block" id="google-signup">
                <span class="google-slot"></span>
                <span>Continue with Google</span>
            </button>

            <p class="auth-footer">
                Already have an account? <a href="login.html" class="text-link">Log in</a>
            </p>
        </main>
    </div>

    <script type="module" src="signup.js"></script>
</body>
</html>
